name: TrustGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Verify critical dependencies
        run: python -c "import redis; import tldextract; print('redis:', redis.__version__, 'tldextract:', tldextract.__version__)"

      - name: Start backend
        run: |
          nohup uvicorn app.main:app --port 8000 &
          for i in {1..20}; do
            if curl -s http://localhost:8000/health | grep -q "ok"; then
              echo "Backend started successfully!"
              break
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          curl -sf http://localhost:8000/health
        env:
          TRUSTGUARD_API_KEY: ci-test-key

      - name: Run pytest
        run: pytest --tb=short
        env:
          TRUSTGUARD_API_KEY: ci-test-key

  test-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Verify critical dependencies
        run: python -c "import redis; import tldextract; print('redis:', redis.__version__, 'tldextract:', tldextract.__version__)"

      - name: Start backend
        run: |
          nohup uvicorn app.main:app --port 8000 &
          for i in {1..20}; do
            if curl -s http://localhost:8000/health | grep -q "ok"; then
              echo "Backend started successfully!"
              break
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          curl -sf http://localhost:8000/health
        env:
          TRUSTGUARD_API_KEY: ci-test-key

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: frontend
        env:
          VITE_API_KEY: ci-test-key

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
